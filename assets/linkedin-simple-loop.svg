<svg viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title4 desc4">
<title id="title4">How a loop works, simplified</title>
<desc id="desc4">Three steps in a cycle around a central loop label: trigger, verify, remember, with a one-line caption below.</desc>
<defs>
  <marker id="arrow4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/>
  </marker>
</defs>

<rect x="0" y="0" width="480" height="560" fill="#f5f5f5"/>

<circle cx="240" cy="264" r="76" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
<text x="240" y="258" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#2d3142">THE</text>
<text x="240" y="278" text-anchor="middle" font-family="Geist, sans-serif" font-size="16" font-weight="600" fill="#2d3142">LOOP</text>

<circle cx="240" cy="84" r="60" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="240" y="80" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#2d3142">1. Trigger</text>
<text x="240" y="98" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">you ask, once</text>

<circle cx="396" cy="372" r="60" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="396" y="368" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#2d3142">2. Verify</text>
<text x="396" y="386" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">checks the result</text>

<circle cx="84" cy="372" r="60" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="84" y="364" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="600" fill="#2d3142">3. Remember</text>
<text x="84" y="382" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">keeps the state</text>

<path d="M 268.6 136.7 Q 381.6 198.7 367.4 319.3" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow4)"/>
<path d="M 336 372 Q 240 442 144 372" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow4)"/>
<path d="M 112.6 319.3 Q 98.4 198.7 211.4 136.7" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow4)"/>

<text x="240" y="500" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-size="24" fill="#2d3142">Set it up once. It runs the loop.</text>
<text x="240" y="536" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" letter-spacing="0.06em" fill="#7a8399">GITHUB.COM/AMS-BUILDS/LOOP-BUILDER</text>

</svg>
