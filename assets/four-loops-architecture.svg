<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title2 desc2">
<title id="title2">Four-loop architecture example</title>
<desc id="desc2">A scheduled sync task feeds a shared loop hub, which fans out to four illustrative loops: an article checker, a PRD checker, a code review loop, and an email follow-up loop, each reading its own skill or database source. A LOOP chip marks the repeating tasks, a SRC chip marks their sources, dashed boxes are skills kept in sync by the scheduled task, solid muted boxes are databases with nothing to sync.</desc>
<defs>
  <marker id="arrow2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
</defs>

<rect x="0" y="0" width="1200" height="720" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, serif" font-size="28" fill="#2d3142">A working example</text>
<text x="40" y="64" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">FOUR ILLUSTRATIVE LOOPS SHARING ONE HUB PAGE</text>

<!-- Scheduled sync task -->
<rect x="460" y="88" width="280" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<rect x="470" y="94" width="36" height="16" rx="4" fill="#ececec"/>
<text x="488" y="106" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SYNC</text>
<text x="600" y="110.9" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Scheduled Sync Task</text>
<text x="600" y="128.9" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">runs daily, outside any chat</text>
<line x1="600" y1="144" x2="600" y2="180" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow2)"/>
<text x="612" y="166" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">daily</text>

<!-- Hub: focal treatment, the one accent -->
<rect x="440" y="184" width="320" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="452" y="192" width="34" height="16" rx="4" fill="#ececec"/>
<text x="469" y="204" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">HUB</text>
<text x="600" y="208.2" text-anchor="middle" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Loop Hub</text>
<text x="600" y="226.2" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">one page per loop, state lives here</text>
<text x="600" y="240.2" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">not in any single conversation</text>

<!-- 4 loop boxes, spread across the body width -->
<rect x="40" y="334" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="50" y="340" width="40" height="16" rx="4" fill="#ececec"/>
<text x="70" y="352" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LOOP</text>
<text x="140" y="368.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Article</text>
<text x="140" y="382.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Checker Loop</text>
<rect x="347" y="334" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="357" y="340" width="40" height="16" rx="4" fill="#ececec"/>
<text x="377" y="352" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LOOP</text>
<text x="447" y="368.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">PRD Checker</text>
<text x="447" y="382.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Loop</text>
<rect x="653" y="334" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="663" y="340" width="40" height="16" rx="4" fill="#ececec"/>
<text x="683" y="352" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LOOP</text>
<text x="753" y="368.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Code Review</text>
<text x="753" y="382.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Loop</text>
<rect x="960" y="334" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="970" y="340" width="40" height="16" rx="4" fill="#ececec"/>
<text x="990" y="352" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LOOP</text>
<text x="1060" y="368.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Email</text>
<text x="1060" y="382.4" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Follow-up Loop</text>
<line x1="500" y1="256" x2="140" y2="330" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="560" y1="256" x2="447" y2="330" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="640" y1="256" x2="753" y2="330" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="700" y1="256" x2="1060" y2="330" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow2)"/>

<!-- sources row -->
<rect x="150" y="494" width="220" height="76" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="158" y="500" width="34" height="16" rx="4" fill="#ececec"/>
<text x="175" y="512" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SRC</text>
<text x="260" y="527.6" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">writing-style</text>
<text x="260" y="543.6" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">skill, external to the hub</text>
<rect x="430" y="494" width="200" height="76" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="438" y="500" width="34" height="16" rx="4" fill="#ececec"/>
<text x="455" y="512" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SRC</text>
<text x="530" y="527.6" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">prd-template</text>
<text x="530" y="543.6" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">skill, external to the hub</text>
<rect x="690" y="494" width="140" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
<rect x="698" y="500" width="34" height="16" rx="4" fill="#ececec"/>
<text x="715" y="512" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SRC</text>
<text x="760" y="527.6" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Pull Requests</text>
<text x="760" y="543.6" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">database</text>
<rect x="970" y="494" width="180" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
<rect x="978" y="500" width="34" height="16" rx="4" fill="#ececec"/>
<text x="995" y="512" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SRC</text>
<text x="1060" y="527.6" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#2d3142">Contacts</text>
<text x="1060" y="543.6" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75">database</text>
<line x1="170" y1="410" x2="230" y2="490" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="420" y1="410" x2="320" y2="490" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="480" y1="410" x2="510" y2="490" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="753" y1="410" x2="760" y2="490" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="1060" y1="410" x2="1060" y2="490" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow2)"/>

<!-- legend, spread across the body width -->
<line x1="40" y1="610" x2="1160" y2="610" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="636" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">PIECES</text>
<rect x="140" y="626" width="40" height="16" rx="4" fill="#ececec"/>
<text x="160" y="638" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">LOOP</text>
<text x="192" y="638" font-family="Geist, sans-serif" font-size="11" fill="#2d3142">a repeating task</text>
<rect x="650" y="626" width="34" height="16" rx="4" fill="#ececec"/>
<text x="667" y="638" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#2d3142">SRC</text>
<text x="696" y="638" font-family="Geist, sans-serif" font-size="11" fill="#2d3142">what that task reads from</text>
<text x="40" y="666" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">SOURCE TYPE</text>
<rect x="140" y="656" width="28" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
<text x="180" y="668" font-family="Geist, sans-serif" font-size="11" fill="#2d3142">skill, kept in sync by the task above</text>
<rect x="650" y="656" width="28" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
<text x="690" y="668" font-family="Geist, sans-serif" font-size="11" fill="#2d3142">database, nothing to sync</text>

</svg>
